<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live — Login</title>
  <link rel="stylesheet" href="/static/live.css">
</head>
<body>
<div class="login-wrap">
  <div class="card">
    <div class="live-logo" style="margin-bottom:16px;">BOTS LIVE</div>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form method="POST" action="/live/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               autofocus required>
      </div>
      <div class="field">
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" name="passcode"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
    </form>
    <p style="margin-top:14px;text-align:center;font-size:13px;">
      No account? <a href="/live/register">Register</a>
    </p>
    <p style="margin-top:10px;text-align:center;font-size:13px;">
      <a href="{{ url_for('labs.dashboard') }}">Back to Labs</a>
    </p>
  </div>
</div>
</body>
</html>
